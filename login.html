<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIPLEX - Login</title>
    <style>
        body {
            background-color: #111d2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid #2bb7f6;
            padding-bottom: 15px;
        }

        header h1 {
            color: #ffb800;
        }

        nav a {
            color: #2bb7f6;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 400px;
            margin: 40px auto;
            background-color: #1a2938;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            color: #ffffff;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        /* FIX: Applies to ALL input types (email, password, text, etc.) */
        input {
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 10px;
            background-color: #243647;
            color: #ffffff;
            border: 1px solid #364c61;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background-color: #ffb800;
            color: #111d2a;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #e0a200;
        }
    </style>
</head>
<body>

    <header>
        <h1>LOGIN HERE</h1>
        <nav>
            <a href="home.html">HOME PAGE</a> | 
            <a href="registration.html">New User Click Here</a>
        </nav>
    </header>

    <main>
        <form id="login-form">
            <div>
                <label for="login-email">EMAIL</label>
                <input type="email" id="login-email" placeholder="enter email@domain.com" required>
            </div>
            <br>
            <div>
                <label for="login-password">PASSWORD</label>
                <input type="password" id="login-password" placeholder="enter your password" required>
            </div>
            <br>
            <button type="submit">SUBMIT</button>
        </form>
    </main>

</body>
</html>
