<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Register Here</h1>
    <hr>
    <h6><a href="login.html">LOGIN PAGE</a></h6>
    
    
    <form>
        
        <label for="101">Full Name</label><br>
        <input type="text" placeholder="enter your name" id="101" required>
        <br>
        <br>
        <label for="102">Surname</label><br>
        <input type="text" placeholder="enter your lastname" id="102">
        <br>
        <br>
        <label>Gender</label><br>
        <input type="radio" id="female"  name="gender">
        <label for="female">Female</label>

        <input type="radio" id="male"  name="gender" >
        <label for="male">Male</label>

        <input type="radio" id="others" name="gender" >
        <label for="others">Others</label>
        <br>
        <br>
      

        <label for="email">Email</label><br>
        <input type="email" id="email" placeholder="enter your email">
        <br>
        <br>

        
        <label for="address">Address</label><br>
        <input type="textArea" id="address" placeholder="enter your address" ></input>
        <br>
        <br>

        
        <label>Interests</label><br>
        <input type="checkbox" id="horror" >
        <label for="horror">Horror</label>

        <input type="checkbox" id="family" >
        <label for="family">Family</label>

        <input type="checkbox" id="dramatic" >
        <label for="dramatic">Dramatic</label>

        <input type="checkbox" id="emotional" >
        <label for="emotional">Emotional</label>
        <br>  
        <br>
        
        <label>Preferred Languages</label><br>
        <input type="checkbox" id="telugu"  >
        <label for="telugu">Telugu</label>

        <input type="checkbox" id="hindi"  >
        <label for="hindi">Hindi</label>

        <input type="checkbox" id="english" >
        <label for="english">English</label>

        <input type="checkbox" id="marathi" >
        <label for="marathi">Marathi</label>
        <br>
        <br>
        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
