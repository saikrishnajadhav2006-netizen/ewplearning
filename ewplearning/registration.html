<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Page</title>

    <script>

        function validateForm() {

           
            let name = document.getElementById("101").value.trim();

            if (name === "") {
                alert("Please enter your Full Name");
                return false;
            }


    
            let surname = document.getElementById("102").value.trim();

            if (surname === "") {
                alert("Please enter your Surname");
                return false;
            }


   
            let gender = document.querySelector(
                'input[name="gender"]:checked'
            );

            if (!gender) {
                alert("Please select your Gender");
                return false;
            }


            let email = document.getElementById("email").value.trim();

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {
                alert("Please enter your Email");
                return false;
            }

            if (!emailPattern.test(email)) {
                alert("Please enter a valid Email");
                return false;
            }


    
            let address = document.getElementById("address").value.trim();

            if (address === "") {
                alert("Please enter your Address");
                return false;
            }



            let interests = document.querySelectorAll(
                'input[name="interest"]:checked'
            );

            if (interests.length === 0) {
                alert("Please select at least one Interest");
                return false;
            }


            let languages = document.querySelectorAll(
                'input[name="language"]:checked'
            );

            if (languages.length === 0) {
                alert("Please select at least one Preferred Language");
                return false;
            }



            alert("Registration Successful!");

            return true;
        }

    </script>
